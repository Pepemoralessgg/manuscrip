<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso · Manuscrip MVP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container auth-page">
      <header>
        <h1>Acceso a Manuscrip</h1>
        <p class="muted">Inicia sesión o crea una cuenta con email y contraseña (Supabase Auth).</p>
        <p class="header-links">
          <a href="/">← Volver a la app</a>
        </p>
      </header>

      <div class="card auth-card">
        <!-- Pestañas sin JS: radios + label (funciona aunque CSP bloquee inline o falle auth.js) -->
        <div class="auth-switch">
          <input type="radio" name="authview" id="auth-v-login" class="auth-view-radio" checked />
          <input type="radio" name="authview" id="auth-v-register" class="auth-view-radio" />

          <div class="auth-tabs" role="tablist">
            <label for="auth-v-login" class="auth-tab-label" id="tab-login">Iniciar sesión</label>
            <label for="auth-v-register" class="auth-tab-label" id="tab-register">Crear cuenta</label>
          </div>

          <div class="auth-panel-c login-panel-c" id="panel-login">
            <h2 class="auth-panel-title">Iniciar sesión</h2>
            <form id="loginForm">
              <label>
                Email
                <input type="email" name="email" autocomplete="email" required />
              </label>
              <label>
                Contraseña
                <input type="password" name="password" autocomplete="current-password" required />
              </label>
              <button type="submit" id="loginSubmit">Entrar</button>
            </form>
          </div>

          <div class="auth-panel-c register-panel-c" id="panel-register">
            <h2 class="auth-panel-title">Crear cuenta</h2>
            <form id="registerForm">
              <label>
                Email
                <input type="email" name="email" autocomplete="email" required />
              </label>
              <label>
                Contraseña
                <input
                  type="password"
                  name="password"
                  autocomplete="new-password"
                  required
                  minlength="6"
                />
              </label>
              <label>
                Repetir contraseña
                <input
                  type="password"
                  name="password2"
                  autocomplete="new-password"
                  required
                  minlength="6"
                />
              </label>
              <button type="submit" id="registerSubmit">Registrarme</button>
            </form>
          </div>
        </div>

        <p id="authStatus" class="status auth-status" aria-live="polite"></p>
        <p id="authSuccess" class="auth-success muted" hidden></p>
        <p class="auth-after-login" hidden id="authContinueWrap">
          <a href="/" class="auth-continue-link">Continuar a la app →</a>
        </p>
      </div>
    </main>

    <script type="module" src="auth.js"></script>
  </body>
</html>
